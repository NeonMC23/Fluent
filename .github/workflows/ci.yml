name: CI and build artifacts

# Builds are validation and downloadable workflow artifacts, not GitHub
# Releases. Signing is optional and only runs on non-PR events when the
# MINISIGN_SECRET_KEY secret is configured.

on:
  push:
    branches:
      - main
      - "finalization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Ubuntu 22.04, glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev \
            desktop-file-utils xvfb libgl1-mesa-dri libxkbcommon-x11-0 \
            xdotool x11-utils
      - name: Verify branding assets
        run: python3 scripts/verify-branding-assets.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy log on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: linux-clippy-log
          path: clippy.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Configure release path remapping
        run: python3 scripts/set-ci-remap.py
      - name: Release GUI build
        run: cargo build --release --locked -p fluent-gui
      - name: Verify GLIBC 2.35 baseline and embedded mark
        run: |
          ./scripts/check-linux-baseline.sh target/release/fluent 2.35
          python3 - <<'PY'
          from pathlib import Path
          binary = Path("target/release/fluent").read_bytes()
          mark = Path("src/logo/generated/window/fluent-256.rgba").read_bytes()
          if mark not in binary:
              raise SystemExit("canonical mark RGBA is not embedded in the GUI binary")
          print("embedded window/header mark: OK")
          PY
      - name: Installer regression tests
        run: ./scripts/test-installer.sh
      - name: Portable Linux archive
        run: |
          ./scripts/package-linux.sh --skip-build
          (cd dist && sha256sum -c ./*.sha256)
      - name: Verify archive and run packaged GUI smoke test
        run: |
          python3 scripts/verify-artifacts.py --dir dist --version "$(./scripts/version.sh)"
          SMOKE="$(mktemp -d)"
          tar -xzf dist/fluent-*.tar.gz -C "$SMOKE"
          BIN="$(find "$SMOKE" -path '*/bin/fluent' -type f -print -quit)"
          test -n "$BIN"
          export HOME="$SMOKE/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          cd "$SMOKE"
          "$BIN" --version
          "$BIN" --help | tee fluent-help.txt
          grep -Fq "local multilingual translation and chat" fluent-help.txt
          grep -Fq "Model Manager" fluent-help.txt
          "$BIN" --self-test | tee fluent-self-test.txt
          grep -Fq "model-root: platform default" fluent-self-test.txt
          grep -Fq "$XDG_DATA_HOME/fluent/models/nllb-200-1.3b" fluent-self-test.txt
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BIN" --smoke-test-gui
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            ./scripts/check-linux-window-icon.sh "$BIN"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fluent-linux-x86_64
          path: |
            dist/fluent-*.tar.gz
            dist/fluent-*.tar.gz.sha256
          retention-days: 14

  windows:
    name: Windows x86_64 (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Tests
        run: cargo test --workspace --locked
      - name: Configure release path remapping
        run: python scripts/set-ci-remap.py
      - name: Release GUI build
        run: cargo build --release --locked -p fluent-gui
      - name: Portable Windows ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          python scripts/package-windows.py `
            --binary target/release/fluent.exe --version $version --output dist
      - name: Verify ZIP and run packaged smoke tests
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "windows-smoke.log"
          try {
            "== verify ==" | Tee-Object -FilePath $log
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
              Select-Object -First 1).Matches.Groups[1].Value
            $verifyOutput = python scripts/verify-artifacts.py --dir dist --version $version 2>&1
            $verifyExit = $LASTEXITCODE
            $verifyOutput | Tee-Object -FilePath $log -Append
            if ($verifyExit -ne 0) { throw "artifact verification failed" }
            $smoke = Join-Path $env:RUNNER_TEMP "fluent smoke ü"
            Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $smoke | Out-Null
            $zip = (Get-ChildItem dist\fluent-*.zip | Select-Object -First 1).FullName
            Expand-Archive -Path $zip -DestinationPath $smoke
            $exe = Join-Path $smoke "fluent.exe"
            $unrelated = Join-Path $env:RUNNER_TEMP "fluent unrelated cwd"
            New-Item -ItemType Directory -Path $unrelated -Force | Out-Null
            "== metadata ==" | Tee-Object -FilePath $log -Append
            $info = (Get-Item $exe).VersionInfo
            $info | Format-List | Out-String | Tee-Object -FilePath $log -Append
            if ($info.ProductName -ne "Fluent") { throw "unexpected ProductName: $($info.ProductName)" }
            if ($info.FileDescription -notlike "*Local Translation and Chat*") {
              throw "unexpected FileDescription: $($info.FileDescription)"
            }
            if ($info.OriginalFilename -ne "fluent.exe") {
              throw "unexpected OriginalFilename: $($info.OriginalFilename)"
            }
            if ($info.FileVersion -notlike "$version*") {
              throw "unexpected FileVersion: $($info.FileVersion)"
            }
            $icon = $null
            try {
              Add-Type -AssemblyName System.Drawing
              $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
            } catch {
              try {
                Add-Type -AssemblyName System.Drawing.Common
                $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
              } catch {
                Write-Output "::warning title=Windows icon smoke skipped::Could not load System.Drawing to extract the embedded icon."
              }
            }
            if ($null -ne $icon) { "icon: OK ($($icon.Width)x$($icon.Height))" | Tee-Object -FilePath $log -Append }
            "== version ==" | Tee-Object -FilePath $log -Append
            $versionOutput = & $exe --version 2>&1
            $versionExit = $LASTEXITCODE
            $versionOutput | Tee-Object -FilePath $log -Append
            if ($versionExit -ne 0) { throw "fluent --version failed" }
            if ($versionOutput -notlike "*Fluent $version*") {
              throw "unexpected version output: $versionOutput"
            }
            "== help ==" | Tee-Object -FilePath $log -Append
            $helpOutput = (& $exe --help 2>&1 | Out-String)
            $helpOutput | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "fluent --help failed" }
            if ($helpOutput -notlike "*local multilingual translation and chat*") {
              throw "product description missing from help"
            }
            if ($helpOutput -notlike "*Model Manager*") {
              throw "Model Manager description missing from help"
            }
            "== self-test and storage ==" | Tee-Object -FilePath $log -Append
            Push-Location $unrelated
            try {
              $selfOutput = (& $exe --self-test 2>&1 | Out-String)
              $selfExit = $LASTEXITCODE
            } finally {
              Pop-Location
            }
            $selfOutput | Tee-Object -FilePath $log -Append
            if ($selfExit -ne 0) { throw "fluent --self-test failed" }
            if ($selfOutput -notmatch "model-root: platform default") {
              throw "self-test did not report the platform default model root"
            }
            if ($selfOutput -notmatch "Fluent\\data\\models\\nllb-200-1.3b") {
              throw "self-test model path is not under the per-user AppData root"
            }
            if ($selfOutput -match [regex]::Escape($unrelated)) {
              throw "self-test used the unrelated working directory"
            }
            "== config path and Unicode ==" | Tee-Object -FilePath $log -Append
            $configDir = Join-Path $smoke "config ü"
            $modelDir = Join-Path $smoke "模型 with spaces"
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
            $configPath = Join-Path $configDir "config.json"
            @{ models = @{ fast = $modelDir } } | ConvertTo-Json -Depth 5 | Set-Content -Path $configPath -Encoding utf8NoBOM
            $env:FLUENT_CONFIG = $configPath
            Push-Location $unrelated
            try {
              $configOutput = (& $exe --self-test 2>&1 | Out-String)
              $configExit = $LASTEXITCODE
            } finally {
              Remove-Item Env:\FLUENT_CONFIG -ErrorAction SilentlyContinue
              Pop-Location
            }
            $configOutput | Tee-Object -FilePath $log -Append
            if ($configExit -ne 0) { throw "configured self-test failed" }
            if ($configOutput -notmatch [regex]::Escape($modelDir)) {
              throw "explicit config path was not used"
            }
            "== no automatic download ==" | Tee-Object -FilePath $log -Append
            $modelFiles = Get-ChildItem -Path (Join-Path $env:APPDATA "fluent\Fluent\data\models") -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in ".gguf", ".safetensors", ".bin" }
            if ($modelFiles) { throw "unexpected model files were created" }
            Set-Location $smoke
            "== gui smoke ==" | Tee-Object -FilePath $log -Append
            $guiOutput = & $exe --smoke-test-gui 2>&1
            $guiExit = $LASTEXITCODE
            $guiOutput | Tee-Object -FilePath $log -Append
            if ($guiExit -ne 0) {
              $guiText = ($guiOutput | Out-String)
              if ($guiText -match 'egui_glow requires opengl|OpenGL') {
                Write-Output "::warning title=Windows GUI smoke skipped::GitHub's hosted Windows runner has no OpenGL 2.0+ context; executable startup, version, icon, language and config checks passed."
                $global:LASTEXITCODE = 0
              } else {
                throw "fluent --smoke-test-gui failed"
              }
            }
          } catch {
            $text = Get-Content $log -Raw -ErrorAction SilentlyContinue
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows smoke log::$escaped"
            throw
          }
          exit 0
      - name: Upload Windows smoke log on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: windows-smoke-log
          path: windows-smoke.log
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fluent-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 14

  macos:
    name: macOS (native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee macos-test.log
      - name: Upload macOS test log on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: macos-test-log
          path: macos-test.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Configure release path remapping
        run: python3 scripts/set-ci-remap.py
      - name: Release GUI build
        run: cargo build --release --locked -p fluent-gui
      - name: Stage and archive Fluent.app
        run: |
          ./scripts/package-macos.sh --skip-build
          ./scripts/package-macos-archive.py \
            --app dist/Fluent.app \
            --version "$(./scripts/version.sh)" \
            --arch "$(uname -m)" \
            --output dist
      - name: Verify bundle and run packaged smoke tests
        run: |
          set -euo pipefail
          python3 scripts/verify-artifacts.py --dir dist --version "$(./scripts/version.sh)"
          SMOKE="$(mktemp -d)"
          ditto -x -k dist/Fluent-*.zip "$SMOKE"
          APP="$SMOKE/Fluent.app"
          PLIST="$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/fluent"
          test -s "$APP/Contents/Resources/Fluent.icns"
          cmp "$APP/Contents/Resources/Fluent.icns" src/logo/generated/macos/Fluent.icns
          test "$(cat "$APP/Contents/PkgInfo")" = "APPL????"
          plutil -lint "$PLIST"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")" = "io.fluent.Fluent"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" = "$(./scripts/version.sh)"
          test "$(plutil -extract CFBundleVersion raw -o - "$PLIST")" = "$(./scripts/version.sh)"
          test "$(plutil -extract CFBundleExecutable raw -o - "$PLIST")" = "fluent"
          test "$(plutil -extract CFBundleIconFile raw -o - "$PLIST")" = "Fluent.icns"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$PLIST")" = "12.0"
          lipo -archs "$APP/Contents/MacOS/fluent" | tr -d '[:space:]' | grep -qx "arm64"
          file "$APP/Contents/MacOS/fluent" | grep -q "Mach-O 64-bit executable arm64"
          find "$APP" -type f | sort > "$SMOKE/app-before.txt"
          export HOME="$SMOKE/home"
          mkdir -p "$HOME"
          UNRELATED="$(mktemp -d)"
          cd "$UNRELATED"
          "$APP/Contents/MacOS/fluent" --version | tee "$SMOKE/version.txt"
          "$APP/Contents/MacOS/fluent" --help | tee "$SMOKE/help.txt"
          grep -Fq "local multilingual translation and chat" "$SMOKE/help.txt"
          grep -Fq "Model Manager" "$SMOKE/help.txt"
          "$APP/Contents/MacOS/fluent" --self-test | tee "$SMOKE/self-test.txt"
          grep -Fq "model-root: platform default" "$SMOKE/self-test.txt"
          grep -Fq "Library/Application Support/io.fluent.Fluent/models/nllb-200-1.3b" "$SMOKE/self-test.txt"
          if grep -F "fast-model:" "$SMOKE/self-test.txt" | grep -Fq "$APP"; then
            echo "application bundle was used for model storage" >&2
            exit 1
          fi
          find "$APP" -type f | sort > "$SMOKE/app-after.txt"
          cmp "$SMOKE/app-before.txt" "$SMOKE/app-after.txt"
          if find "$APP" -type f \( -name '*.gguf' -o -name '*.safetensors' -o -name 'config.json' \) | grep -q .; then
            echo "mutable or model data found inside the app bundle" >&2
            exit 1
          fi
          "$APP/Contents/MacOS/fluent" --smoke-test-gui
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fluent-macos
          path: |
            dist/Fluent-*.zip
            dist/Fluent-*.zip.sha256
          retention-days: 14

  release-integrity:
    name: Release integrity
    needs: [linux, windows, macos]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: fluent-*
          path: dist
          merge-multiple: true
      - name: Stage the public verification key
        run: cp docs/keys/minisign.pub dist/minisign.pub
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action
        with:
          toolchain: 1.99.0
      - name: Install Minisign-compatible signer
        run: |
          cargo install rsign2 --version 0.6.7 --locked --root "$RUNNER_TEMP/rsign"
          echo "$RUNNER_TEMP/rsign/bin" >> "$GITHUB_PATH"
      - name: Sign if the protected secret is configured
        id: signing
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            install -d -m 700 "$RUNNER_TEMP/minisign"
            printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign/minisign.key"
            chmod 600 "$RUNNER_TEMP/minisign/minisign.key"
            MINISIGN_SECRET_KEY_FILE="$RUNNER_TEMP/minisign/minisign.key" \
              ./scripts/sign-artifacts.sh dist/*.tar.gz dist/*.zip
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No MINISIGN_SECRET_KEY configured; artifacts are unsigned." \
              | tee dist/UNSIGNED.txt
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify detached signatures
        if: steps.signing.outputs.signed == 'true'
        run: |
          MINISIGN_PUBLIC_KEY_FILE=docs/keys/minisign.pub \
            ./scripts/verify-artifacts.sh dist/*.tar.gz dist/*.zip
      - name: Generate release manifest
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          ARGS=(
            --dir dist
            --version "$(./scripts/version.sh)"
            --commit "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --workflow "$GITHUB_WORKFLOW"
            --public-key docs/keys/minisign.pub
            --output dist/release-manifest.json
          )
          if [ "$SIGNED" = "true" ]; then
            ARGS+=(--signatures-verified)
          fi
          python3 scripts/release-manifest.py "${ARGS[@]}"
      - name: Verify release candidate contents
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          ARGS=(
            --dir dist
            --version "$(./scripts/version.sh)"
            --public-key docs/keys/minisign.pub
            --expected-commit "$GITHUB_SHA"
            --expected-run-id "$GITHUB_RUN_ID"
          )
          if [ "$SIGNED" = "true" ]; then
            ARGS+=(--require-signatures)
          fi
          python3 scripts/verify-artifacts.py "${ARGS[@]}"
      - name: Publish checksum summary
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          directory = Path("dist")
          parts = []
          for path in sorted(directory.iterdir()):
              if not path.is_file():
                  continue
              if not (path.name.endswith(".tar.gz") or path.name.endswith(".zip")):
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              parts.append(f"{path.name} {path.stat().st_size} {digest}")
          manifest = directory / "release-manifest.json"
          status = "missing"
          verified = False
          if manifest.is_file():
              document = json.loads(manifest.read_text(encoding="utf-8"))
              status = document.get("signing", {}).get("minisign_status", "unknown")
              verified = document.get("signing", {}).get("signatures_verified", False)
          print(
              "::notice title=Distribution archive SHA-256::"
              + " | ".join(parts)
              + f" | signing={status} verified={verified}"
          )
          PY
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fluent-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.minisig
            dist/release-manifest.json
            dist/minisign.pub
            dist/UNSIGNED.txt
          retention-days: 14
