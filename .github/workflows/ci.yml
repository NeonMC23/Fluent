name: CI

# Validation only. No model downloads, secrets, signing, artifacts or releases.
# The Linux job is the locally verified quality gate. The Windows/macOS job
# compiles and unit-tests the platform-neutral core crate; it is not a GUI or
# runtime validation.

on:
  push:
    branches:
      - main
      - "finalization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev \
            desktop-file-utils
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Tests (no model required)
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release GUI build
        run: cargo build --release -p fluent-gui
      - name: Installer tests
        run: ./scripts/test-installer.sh
      - name: Portable archive smoke test
        run: |
          ./scripts/package-linux.sh --skip-build
          (cd dist && sha256sum -c ./*.sha256)

  core-portability:
    name: Core compile check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check core crate
        run: cargo check -p fluent-core --all-targets
      - name: Unit tests (no model required)
        run: cargo test -p fluent-core --lib
